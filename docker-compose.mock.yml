services:
  mujoco_warp_locomotion_sim:
    image: mujoco-warp-locomotion-sim:mock-local
    build:
      args:
        SIM_EXTRAS: ""
    runtime: runc
    command:
      - mujoco-warp-locomotion-sim
      - serve
      - --config
      - /app/config/default.toml
      - --backend
      - mock
      - --host
      - 127.0.0.1
    deploy:
      resources:
        reservations:
          devices: !reset []
